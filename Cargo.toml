[workspace]
# Listed by name so output-only folders under examples/ do not break the build.
members = [
    "crates/tangle_app",
    "crates/tangle_characterize",
    "crates/tangle_checkpoint",
    "crates/tangle_contact",
    "crates/tangle_core",
    "crates/tangle_ct",
    "crates/tangle_export",
    "crates/tangle_generate",
    "crates/tangle_python",
    "crates/tangle_relax",
    "examples/adaptive_crossed_fibers",
    "examples/biased_fiber_box",
    "examples/felt_20ply_control_vs_needled",
    "examples/fibers_through_center_point",
    "examples/multisegment_flexible_relaxation",
    "examples/needled_felt_toy",
    "examples/needled_preform_two_fiber",
    "examples/puma_cross_validation",
    "examples/tangle_example_support",
    "examples/tps_preform_formation",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SueHeir/tangle"

[workspace.dependencies]
tangle_core = { path = "crates/tangle_core", version = "0.1.0" }
tangle_ct = { path = "crates/tangle_ct", version = "0.1.0" }
tangle_app  = { path = "crates/tangle_app",  version = "0.1.0" }
tangle_contact = { path = "crates/tangle_contact", version = "0.1.0", default-features = false }
tangle_characterize = { path = "crates/tangle_characterize", version = "0.1.0" }
tangle_checkpoint = { path = "crates/tangle_checkpoint", version = "0.1.0" }
tangle_export = { path = "crates/tangle_export", version = "0.1.0" }
tangle_generate = { path = "crates/tangle_generate", version = "0.1.0" }
tangle_relax = { path = "crates/tangle_relax", version = "0.1.0" }
cubecl = { version = "=0.11.0-pre.3", default-features = false }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grass_app = { git = "https://github.com/SueHeir/grass.git", rev = "f62e7a5", version = "0.1.1" }
grass_derive = { git = "https://github.com/SueHeir/grass.git", rev = "f62e7a5", version = "0.1.1" }
grass_scheduler = { git = "https://github.com/SueHeir/grass.git", rev = "f62e7a5", version = "0.1.1" }

[profile.release]
opt-level = 3
lto = "thin"
