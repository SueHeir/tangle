[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "tangle"
version = "0.1.0"
description = "Python interface to TANGLE fiber assembly and CubeCL formation recipes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "TANGLE contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# The core package needs nothing else. tangle.ct (CT fitting) needs NumPy and
# SciPy; tifffile and matplotlib write its TIFF and PNG outputs. tangle.fem
# (Nastran and Abaqus meshes) needs NumPy, and gmsh for tetrahedra.
ct = ["numpy>=1.24", "scipy>=1.10", "tifffile", "matplotlib"]
fem = ["numpy>=1.24", "gmsh>=4.11"]

[tool.maturin]
module-name = "tangle._tangle"
python-source = "python"
features = ["pyo3/extension-module"]
