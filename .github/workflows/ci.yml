name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Run device-independent tests
        run: >-
          cargo test
          -p tangle_app
          -p tangle_characterize
          -p tangle_checkpoint
          -p tangle_core
          -p tangle_export
          -p tangle_generate
      - name: Run CubeCL CPU relaxation tests
        run: >-
          cargo test
          -p tangle_relax
          --no-default-features
          --features cpu
          --lib
          --
          --test-threads=1
      - name: Build and test the Python user interface
        run: |
          python -m venv .venv-ci
          source .venv-ci/bin/activate
          python -m pip install "maturin>=1.8,<2" numpy scipy tifffile
          maturin develop --manifest-path crates/tangle_python/Cargo.toml
          python -m unittest discover -s crates/tangle_python/python/tests -v
